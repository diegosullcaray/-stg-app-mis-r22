<div *ngIf='isLoadingSelect'>
    <mat-card class="mat-elevation-z m-033" ><!--style="padding: 0px"-->
        <div fxLayout="row wrap">
            <div [formGroup]="fgroupSelect"
                    *ngFor='let cbo of data'
                    fxFlex="100"
                    fxFlex.gt-sm="16"
                    fxFlex.sm="33">
                <div class="m-033">
                    <mat-form-field style="width: 100%">
                        <mat-label>{{cbo.label}}</mat-label>
                        <mat-select [formControlName]="cbo.variable">
                            <mat-option *ngFor="let r of cbo.data" [value]="r.id">
                                <!--(onSelectionChange)="exec(r,cbo,$event)"-->
                                {{r.desc}}
                            </mat-option>
                        </mat-select>
                    </mat-form-field>
                </div>
            </div>
        </div>
    </div>
</ng-template>

<ng-container *ngIf="isLoadingSelect">
    <ng-container *ngIf="embedded; else cardFilters" [ngTemplateOutlet]="filterFields"></ng-container>
    <ng-template #cardFilters>
        <mat-card class="mat-elevation-z m-033">
            <ng-container [ngTemplateOutlet]="filterFields"></ng-container>
        </mat-card>
    </ng-template>
</ng-container>
