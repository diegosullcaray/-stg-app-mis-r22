<div fxLayout="column">
    <mat-card class="mat-elevation-z m-033 filters-card">
        <ng-container *ngIf="activeHier">
            <hier-rem-selector fxFlex [confHier]="confHier1" (onSelectHier)="selectHier($event)"></hier-rem-selector>
        </ng-container>
        <app-select-multiple
            [embedded]="true"
            [config_select_multiple]="config_select_multiple"
            (refresh)="loadFilter($event)">
        </app-select-multiple>
    </mat-card>

    <mat-tab-group>
        <mat-tab label="Monitor de Efectividades">
            <app-table-multiheader [config_table]="config_table[0]"></app-table-multiheader>
            <div fxLayout="row" fxLayout.lt-md="column">
                <div fxFlex="100" fxFlex.gt-sm="50" fxFlex.sm="50">
                    <app-table-multiheader [config_table]="config_table[2]"></app-table-multiheader>
                </div>
                <div fxFlex="100" fxFlex.gt-sm="50" fxFlex.sm="50">
                    <app-table-multiheader [config_table]="config_table[3]"></app-table-multiheader>
                </div>
            </div>
        </mat-tab>

        <mat-tab label="Detalle de Efectividades">
            <mat-card class="mat-elevation-z m-033 detail-filters-card">
                <app-select-multiple
                    [embedded]="true"
                    [config_select_multiple]="config_select_multiple_ajax"
                    (refresh)="loadFilterAjax($event)">
                </app-select-multiple>

                <div fxLayout="row wrap" fxLayoutAlign="start center">
                    <div fxFlex="100" fxFlex.gt-sm="20" fxFlex.sm="50" class="filter-field">
                        <app-select-basic (refresh)="loadF($event)" [config_select]="config_select"></app-select-basic>
                    </div>

                    <div fxFlex="100" fxFlex.gt-sm="20" fxFlex.sm="50" class="filter-field">
                        <mat-form-field appearance="outline" class="date-filter">
                            <input
                                matInput
                                readonly
                                [matDatepicker]="commitmentPicker"
                                aria-label="Fecha compromiso"
                                placeholder="Fecha compromiso"
                                (dateChange)="addEvent($event)">
                            <mat-datepicker-toggle
                                matSuffix
                                [for]="commitmentPicker"
                                matTooltip="Fecha compromiso"
                                aria-label="Seleccionar fecha compromiso">
                            </mat-datepicker-toggle>
                            <mat-datepicker #commitmentPicker></mat-datepicker>
                        </mat-form-field>
                    </div>

                    <div fxFlex="100" fxFlex.gt-sm="35" fxFlex.sm="50" class="filter-field">
                        <mat-form-field class="full-width">
                            <input matInput [formControl]="txt_asesor" placeholder="Asesor">
                        </mat-form-field>
                    </div>

                    <div fxFlex="100" fxFlex.gt-sm="25" fxFlex.sm="50" class="filter-field">
                        <button mat-raised-button color="primary" (click)="loadAsesor()">
                            <mat-icon>search</mat-icon>
                            Buscar asesor
                        </button>
                    </div>
                </div>
            </mat-card>

            <div class="detail-table m-033">
                <div class="table-state" *ngIf="detailLoading">
                    <mat-spinner [diameter]="40"></mat-spinner>
                </div>
                <div class="table-state error-state" *ngIf="detailError">Error inesperado</div>
                <div class="table-state" *ngIf="!detailLoading && !detailError && detailRows.length === 0">
                    No se encontraron resultados
                </div>

                <ng-container *ngIf="!detailLoading && !detailError && detailRows.length > 0">
                    <mat-card class="mat-elevation-z higher" *ngIf="detailAnnotation?.higher" [innerHTML]="detailAnnotation.higher"></mat-card>
                    <stg-table2
                        [dataSource]="detailRows"
                        [headers]="detailHeaders"
                        [options]="detailTableOptions">
                    </stg-table2>
                    <mat-paginator
                        [length]="detailTotal"
                        [pageSize]="detailPageSize"
                        [pageSizeOptions]="[detailPageSize]"
                        showFirstLastButtons
                        (page)="changeDetailPage($event)">
                    </mat-paginator>
                    <mat-card class="mat-elevation-z lower" *ngIf="detailAnnotation?.lower" [innerHTML]="detailAnnotation.lower"></mat-card>
                </ng-container>
            </div>
        </mat-tab>
    </mat-tab-group>
</div>
